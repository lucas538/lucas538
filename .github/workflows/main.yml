name: generate animation

on:
  # roda automaticamente a cada 24 horas
  schedule:
    - cron: "0 0 * * *"

  # permite rodar manualmente
  workflow_dispatch:

  # roda quando houver push na branch main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Yellow Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FFD700&color_dots=#111111,#332B00,#665500,#B39500,#FFD700
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FFD700&color_dots=#000000,#332B00,#665500,#B39500,#FFD700

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
